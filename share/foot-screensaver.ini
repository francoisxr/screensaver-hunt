# foot settings for the screensaver windows: no padding, black background, a big font so the dishes
# are made of chunky characters. Used unless SLIME_SAVER_FOOT_CONFIG points elsewhere (or Omarchy's own
# screensaver config is found). Needs foot 1.22 or newer for [colors-dark].
[main]
font=monospace:size=18
pad=0x0

[colors-dark]
background=000000
foreground=ffffff
