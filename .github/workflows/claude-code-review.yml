name: Claude Code Review

# One automatic review when a PR is opened. Re-reviews only happen on request,
# by commenting `@claude review` (handled by claude.yml).

on:
  pull_request:
    types: [opened]

jobs:
  claude-review:
    # Dependabot/bot PRs don't get repo secrets, so skip them.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request.
            1. Read the PR description and every existing comment and review
               (`gh pr view --comments`, `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`).
            2. Read the full diff with `gh pr diff`.
            3. Look for correctness bugs, security problems, missing error handling
               and risky behaviour changes. Skip style nitpicks.
            4. Post inline comments on specific lines for each real issue, then post
               one short top-level summary with `gh pr comment`. If you find nothing
               wrong, say so explicitly in the summary.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr checks:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
